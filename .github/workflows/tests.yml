name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit tracked files
        run: python scripts/audit_public_tree.py --tracked
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
