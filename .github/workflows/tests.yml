name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit tracked files
        run: python scripts/audit_public_tree.py --tracked
      - name: Test local credential enrollment with fake storage
        run: |
          dotnet build tools/genshin-login-credential-ui/GenshinLoginCredentialUI.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools/genshin-login-credential-ui/bin/Release/net8.0-windows/GenshinLoginCredentialUI.exe --self-test
          exit $LASTEXITCODE
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Test cultivation plugin without game input
        run: node --test bgi-scripts/AutoGameCultivation/tests/*.test.js
      - name: Test combat rehearsal without game input
        run: node --test bgi-scripts/AutoGameCombatRehearsal/tests/*.test.js
      - name: Test material route and session without game input
        run: node --test bgi-scripts/AutoGameMaterialRoute/tests/*.test.js
